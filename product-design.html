<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdMark Studio | Digital Marketing & Print Media</title>
    <meta name="description"
        content="AdMark Studio - We Design. You Shine. Premium Digital Marketing, Print Media, and Multiservices.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">
                <img src="assets/logo.png" alt="AdMark Studio">
                <span>AdMark Studio</span>
            </a>
            <ul class="nav-links">
                <li><a href="#services">Services</a></li>
                <li><a href="#portfolio">Work</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="#contact" class="nav-btn">Get Started</a></li>
            </ul>
            <div class="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu">
        <div class="close-btn"><i class="fas fa-times"></i></div>

            <li><a href="#home">Home</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>

    <!-- Product Design Gallery -->
    <section class="portfolio fade-in" style="padding-top: 150px; min-height: 80vh;">
        <div class="container">
            <div class="section-header">
                <h2>Product Design.</h2>
                <p>Industrial and UI/UX designs for modern products.</p>
                <a href="index.html" class="link-arrow" style="margin-top: 20px; display: inline-flex;"><i
                        class="fas fa-arrow-left"></i> Back to Home</a>
            </div>

            <div class="portfolio-grid">
                <!-- Gallery Item 1 -->
                <div class="portfolio-item fade-in delay-100">
                    <img src="https://placehold.co/600x600/e0f7fa/0072ff?text=Industrial+Concept"
                        alt="Industrial Concept" class="portfolio-img">
                </div>
                <!-- Gallery Item 2 -->
                <div class="portfolio-item fade-in delay-200">
                    <img src="https://placehold.co/600x600/e1f5fe/00C6FF?text=App+UI" alt="App UI"
                        class="portfolio-img">
                </div>
                <!-- Gallery Item 3 -->
                <div class="portfolio-item fade-in delay-300">
                    <img src="https://placehold.co/600x600/f3e5f5/8E44AD?text=Web+Dashboard" alt="Web Dashboard"

                </div>
                <!-- Gallery Item 4 -->
                <div class="portfolio-item fade-in delay-100">
                    <img src="https://placehold.co/600x600/e0f2f1/009688?text=Gadget+Design" alt="Gadget Design"
                        class="portfolio-img">
                </div>
                <!-- Gallery Item 5 -->
                <div class="portfolio-item fade-in delay-200">
                    <img src="https://placehold.co/600x600/fff3e0/FF9800?text=Kiosk+UI" alt="Kiosk UI"
                        class="portfolio-img">
                </div>
                <!-- Gallery Item 6 -->
                <div class="portfolio-item fade-in delay-300">
                    <img src="https://placehold.co/600x600/fce4ec/E91E63?text=3D+Model" alt="3D Model"
                        class="portfolio-img">
                </div>
            </div>

            <div style="text-align: center; margin-top: 60px;">
                <p class="fade-in">Have a product idea?</p>
                <a href="index.html#contact" class="btn btn-primary fade-in delay-100" style="margin-top: 20px;">Let's
                    Build It</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 AdMark Studio. All rights reserved.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
